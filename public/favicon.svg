<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>SPU ClassLoop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#D12E80"/>
      <stop offset="1" stop-color="#F2994A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EF0DD"/>
      <stop offset="1" stop-color="#119E90"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- studded baseplate -->
  <rect x="1.8" y="26" width="28.4" height="4" rx="1" fill="#7FB069" stroke="#2A1B3D" stroke-width="1"/>
  <g fill="#9BCB84" stroke="#2A1B3D" stroke-width="0.8">
    <rect x="2.3" y="24.6" width="2.3" height="1.8" rx="0.5"/>
    <rect x="27.4" y="24.6" width="2.3" height="1.8" rx="0.5"/>
  </g>

  <g stroke="#2A1B3D" stroke-width="1.1" stroke-linejoin="round">
    <!-- main body -->
    <rect x="5" y="14" width="22" height="12.5" fill="#FFFFFF"/>
    <!-- shallow curved crown spanning the facade -->
    <path d="M4.4 14.6Q16 7.2 27.6 14.6Z" fill="#FFFFFF"/>
  </g>

  <!-- crown fins -->
  <g stroke="#9FA0A5" stroke-width="0.7">
    <path d="M8 13V14.2M10.2 11.9V14.2M21.8 11.9V14.2M24 13V14.2"/>
  </g>

  <!-- side shading -->
  <rect x="11.3" y="14.6" width="1.2" height="11.3" fill="#C3C4C8"/>
  <rect x="25.8" y="14.6" width="0.75" height="11.3" fill="#C3C4C8"/>

  <!-- window bands -->
  <g fill="#8EA6D6">
    <rect x="6.1" y="16.2" width="4.8" height="1.7" rx="0.4"/>
    <rect x="6.1" y="19.4" width="4.8" height="1.7" rx="0.4"/>
    <rect x="6.1" y="22.6" width="4.8" height="1.7" rx="0.4"/>
    <rect x="20.6" y="16.2" width="4.8" height="1.7" rx="0.4"/>
    <rect x="20.6" y="19.4" width="4.8" height="1.7" rx="0.4"/>
    <rect x="20.6" y="22.6" width="4.8" height="1.7" rx="0.4"/>
  </g>

  <!-- teal glass core rising through the crown -->
  <rect x="12.5" y="10.4" width="7" height="16.1" fill="url(#glass)" stroke="#2A1B3D" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M16 11.2V21.6" stroke="#0B6B61" stroke-width="0.8"/>
  <rect x="13.3" y="11.3" width="1.1" height="9" fill="#FFFFFF" opacity="0.6"/>
  <rect x="14.3" y="22.3" width="3.4" height="4.2" rx="0.5" fill="#2A1B3D"/>

  <!-- gold quest flag -->
  <path d="M16 10.4V3" stroke="#2A1B3D" stroke-width="1" stroke-linecap="round"/>
  <path d="M16.3 3.1H21L19.7 4.5L21 5.9H16.3Z" fill="#F2C879" stroke="#2A1B3D" stroke-width="0.7" stroke-linejoin="round"/>
</svg>
